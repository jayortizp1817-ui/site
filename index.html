<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
        }
        a {
            display: block;
            padding: 15px;
            margin: 10px 0;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
        }
        .youtube {
            background: #FF0000;
        }
        .discord {
            background: #5865F2;
        }
        a:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <h1>My Links</h1>
    
    <a href="https://youtube.com" class="youtube">YouTube</a>
    <a href="https://discord.com" class="discord">Discord</a>
</body>
</html>
